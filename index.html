function parseCSV(text) {
  const rows = []; let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

    document.getElementById(t.toLowerCase()).classList.toggle("hidden", t !== name);
  });
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === name));
  if (name === "Weather") loadWeather();
  syncNavHeight();
}

function renderNav() {
  document.getElementById("tabs").innerHTML = tabs.map(t => `<button type="button" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.t));
  syncNavHeight();
}

function setDaysOpen(openAll) {
  document.querySelectorAll("#plan details.day").forEach(el => { el.open = openAll; });
}

function openDay(iso, { accordion = false, scroll = false } = {}) {
  const target = document.getElementById("day-" + iso);
  if (!target) return;
  if (accordion) {
    document.querySelectorAll("#plan details.day").forEach(el => { el.open = el === target; });
  } else {
    target.open = true;
  }
  document.querySelectorAll("#day-jump button").forEach(b => b.classList.toggle("on", b.dataset.iso === iso));
  if (scroll) target.scrollIntoView({ behavior: "smooth", block: "start" });
}

function wirePlanControls() {
  const expand = document.getElementById("expand-all");
  const collapse = document.getElementById("collapse-all");
  if (expand) expand.onclick = () => setDaysOpen(true);
  if (collapse) collapse.onclick = () => setDaysOpen(false);
  document.querySelectorAll("#day-jump button").forEach(b => {
    b.onclick = () => openDay(b.dataset.iso, { accordion: true, scroll: true });
  });
  document.querySelectorAll("#plan details.day").forEach(el => {
    el.addEventListener("toggle", () => {
      if (!el.open) return;
      const iso = el.id.replace(/^day-/, "");
      document.querySelectorAll("#day-jump button").forEach(b => b.classList.toggle("on", b.dataset.iso === iso));
    });
  });
}

function renderPlan() {
  const today = honoluluToday();
  const openIso = days.some(d => d.ISO === today) ? today : (days[0] && days[0].ISO);
  const jumper = `<div id="day-jump">${days.map(d =>
    `<button type="button" data-iso="${esc(d.ISO)}" class="${d.ISO === openIso ? "on" : ""}">${esc(shortDate(d))}</button>`
  ).join("")}</div>`;
  const tools = `<div class="plan-tools">
    <p class="muted">Tap a day to expand</p>
    <div class="tool-btns">
      <button type="button" id="expand-all">Expand all</button>
      <button type="button" id="collapse-all">Collapse all</button>
    </div>
  </div>`;
  const cards = days.map(d => {
    const places = (d.Places || "").split(";").map(p => p.trim()).filter(Boolean);
    const open = d.ISO === openIso ? " open" : "";
    const opts = [
      ["Walk and TheBus", d.Walk_Bus],
      ["Rideshare", d.Rideshare],
      ["Car backup", d.Car_Backup],
      ["Tour option", d.Tour]
    ].filter(([, v]) => v).map(([label, v]) => `<div class="opt"><b>${label}</b>${esc(v)}</div>`).join("");
    return `<details class="day" id="day-${esc(d.ISO)}"${open}>
      <summary class="day-summary">
        <div class="day-text">
          <p class="day-title">${esc(shortDate(d))} · ${esc(d.Title)}</p>
          <p class="day-sub">${d.Low && d.Low !== "0" ? esc(costLabel(d)) + " for two" : "No cost"}</p>
        </div>
      </summary>
      <div class="day-body">
        ${opts}
        <div class="chips">${places.map(p => `<a href="${mapsLink(p)}" target="_blank" rel="noopener">${esc(p)}</a>`).join("")}</div>
      </div>
    </details>`;
  }).join("");
  document.getElementById("plan").innerHTML = jumper + tools + cards;
  wirePlanControls();
  syncNavHeight();
}

function renderDetails() {
  const sections = {};
  details.forEach(d => (sections[d.Section] = sections[d.Section] || []).push(d));
  document.getElementById("details").innerHTML = Object.keys(sections).map(s =>
    `<h3>${esc(s)}</h3>` + sections[s].map(d =>
      `<div class="item"><strong>${esc(d.Item)}</strong>${esc(d.Detail)}${d.Link ? ` <a href="${esc(d.Link)}" target="_blank" rel="noopener">Open</a>` : ""}</div>`
    ).join("")
  ).join("");
}

function renderBudget() {
  const low = days.reduce((s, d) => s + Number(d.Low || 0), 0);
  const high = days.reduce((s, d) => s + Number(d.High || 0), 0);
  document.getElementById("budget").innerHTML = `<div class="card">
    <h2>Trip total (two people, USD)</h2>
    <p class="muted">Excludes flights and hotel. Based on the walk and TheBus plan.</p>
    <div class="table-wrap"><table><tr><th>Date</th><th>Low</th><th>High</th></tr>
    ${days.map(d => `<tr><td>${esc(d.Date)}</td><td>${money(d.Low)}</td><td>${money(d.High)}</td></tr>`).join("")}
    <tr><th>Total</th><th>${money(low)}</th><th>${money(high)}</th></tr></table></div>
  </div>`;
}

const WMO = {
  0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Icy fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain",
  66: "Freezing rain", 67: "Heavy freezing rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Light showers", 81: "Showers", 82: "Heavy showers",
  85: "Snow showers", 86: "Heavy snow showers",
  95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Severe thunderstorm"
};
const wmoLabel = code => WMO[code] || "Unknown";
const fmtDay = iso => {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
};
const f2c = f => Math.round((Number(f) - 32) * 5 / 9);
const tempBoth = f => `${Math.round(Number(f))}&deg;F / ${f2c(f)}&deg;C`;

async function loadWeather() {
  const el = document.getElementById("weather");
  if (el.dataset.done) return;
  el.innerHTML = `<div class="card"><h2>Honolulu weather</h2><p class="muted">Loading live conditions...</p></div>`;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
    `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${encodeURIComponent(CONFIG.tz)}&forecast_days=14`;
  try {
    const r = await fetch(url);
    const j = await r.json();
    if (!r.ok || !j.current || !j.daily) throw new Error(j.reason || "no forecast");
    const c = j.current;
    const updated = new Date(c.time).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
    const rows = j.daily.time.map((t, i) => `<tr>
      <td>${esc(fmtDay(t))}</td>
      <td>${esc(wmoLabel(j.daily.weather_code[i]))}</td>
      <td>${tempBoth(j.daily.temperature_2m_max[i])}</td>
      <td>${tempBoth(j.daily.temperature_2m_min[i])}</td>
      <td>${j.daily.precipitation_probability_max[i] ?? "-"}%</td>
    </tr>`).join("");
    el.innerHTML = `
      <div class="card">
        <h2>Now in Honolulu</h2>
        <p class="muted">Waikiki area · Open-Meteo · as of ${esc(updated)} HST</p>
        <div class="now">
          <div class="now-temp">${Math.round(c.temperature_2m)}&deg;F <small>${f2c(c.temperature_2m)}&deg;C</small></div>
          <div class="now-meta"><strong>${esc(wmoLabel(c.weather_code))}</strong><br>Feels like ${tempBoth(c.apparent_temperature)}</div>
        </div>
        <div class="now-grid">
          <div><span>Humidity</span>${c.relative_humidity_2m}%</div>
          <div><span>Wind</span>${Math.round(c.wind_speed_10m)} mph</div>
          <div><span>Rain</span>${c.precipitation ? c.precipitation + " mm" : "None"}</div>
          <div><span>Trip dates</span>Forecast opens ~2 weeks ahead</div>
        </div>
      </div>
      <div class="card">
        <h2>Next 14 days</h2>
        <p class="muted">Your Nov 30–Dec 11 forecast will fill in closer to the trip.</p>
        <div class="table-wrap"><table>
          <tr><th>Date</th><th>Sky</th><th>High</th><th>Low</th><th>Rain</th></tr>
          ${rows}
        </table></div>
      </div>`;
    el.dataset.done = "1";
  } catch (e) {
    el.innerHTML = `<div class="card"><h2>Weather unavailable</h2><p class="muted">Could not reach Open-Meteo. Check your connection and try again.</p></div>`;
  }
}

async function load() {
  const status = document.getElementById("status");
  try {
    let d = EMBEDDED_DAYS;
    let x = EMBEDDED_DETAILS;
    let source = "offline copy";
    if (location.protocol === "http:" || location.protocol === "https:") {
      try {
        const [fd, fx] = await Promise.all([
          fetch(CONFIG.days, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.text(); }),
          fetch(CONFIG.details, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.text(); })
        ]);
        d = fd; x = fx; source = "your sheet";
      } catch (_) { /* keep embedded */ }
    }
    days = parseCSV(d);
    details = parseCSV(x);
    renderPlan(); renderDetails(); renderBudget();
    status.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + " from " + source;
  } catch (e) {
    status.textContent = "Could not load trip data.";
  }
}

renderNav();
showTab("Plan");
load();
setInterval(load, 10 * 60 * 1000);
window.addEventListener("resize", syncNavHeight);
</script>
</body>
</html>
